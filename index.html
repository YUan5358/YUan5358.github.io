<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:dark;--glass:rgba(0,0,0,.45);--line:rgba(255,255,255,.14)}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;background:#050505;color:#fff;font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:0;z-index:-2;background:#050505 url(https://s41.ax1x.com/2026/04/03/peYnzut.jpg) center/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

.page{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:max(10vh,72px) 16px calc(5vh + env(safe-area-inset-bottom))}
.avatar{width:110px;height:110px;border-radius:30px;object-fit:cover;border:2px solid rgba(255,255,255,.35);box-shadow:0 8px 28px rgba(0,0,0,.5);margin-bottom:18px;animation:rise .6s ease backwards}
h1{font-size:clamp(28px,8vw,34px);font-weight:600;letter-spacing:3px;text-shadow:0 2px 6px rgba(0,0,0,.6);margin-bottom:6px;animation:rise .6s .08s ease backwards}
.sub{color:rgba(235,235,235,.85);font-size:15px;letter-spacing:3px;margin-bottom:32px;text-shadow:0 1px 4px rgba(0,0,0,.5);animation:rise .6s .14s ease backwards}

.links{display:flex;flex-direction:column;gap:12px;width:min(350px,100%)}
.card{--c:#fff;display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:11px 18px 11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-family:inherit;font-size:17px;font-weight:500;text-align:left;text-decoration:none;cursor:pointer;transition:transform .25s,background .25s,border-color .25s;animation:rise .6s ease backwards;animation-delay:calc(.2s + var(--i)*.07s)}
.ico{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);font-size:20px}
.ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card:active{transform:scale(.98)}
@media(hover:hover){.card:hover{transform:translateY(-3px);background:rgba(0,0,0,.62);border-color:var(--c)}}
.featured{display:block;width:min(350px,100%);margin-top:20px;padding:14px 22px;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.3);border-radius:14px;color:#ffd700;font-size:17px;font-weight:500;text-align:center;text-decoration:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .25s,background .25s;animation:rise .6s .5s ease backwards}
@media(hover:hover){.featured:hover{background:rgba(255,215,0,.22);transform:translateY(-2px)}}
.foot{margin-top:18px;font-size:13px;color:rgba(255,255,255,.6)}

.menu-btn{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:20;display:grid;place-content:center;gap:5px;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer}
.menu-btn span{display:block;width:20px;height:2px;border-radius:2px;background:rgba(255,255,255,.9);transition:transform .25s,opacity .25s}
.menu-btn[aria-expanded=true] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-btn[aria-expanded=true] span:nth-child(2){opacity:0}
.menu-btn[aria-expanded=true] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.panel{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 52px);left:12px;z-index:20;width:min(240px,calc(100vw - 24px));padding:8px;border:1px solid var(--line);border-radius:14px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);visibility:hidden;opacity:0;transform:translateY(-6px);transition:.2s}
.panel.open{visibility:visible;opacity:1;transform:none}
.panel button,.panel a{text-decoration:none;display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;color:#fff;font-family:inherit;font-size:15px;cursor:pointer}
@media(hover:hover){.panel button:hover,.panel a:hover{background:rgba(255,255,255,.08)}}
.panel hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.sw{position:relative;width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,.25);transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
[aria-pressed=true] .sw{background:#4cc38a}
[aria-pressed=true] .sw::after{transform:translateX(16px)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:30;max-width:90vw;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:rgba(20,20,20,.92);font-size:14px;opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

.splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;height:100vh;height:100dvh;border:0;background:rgba(5,5,5,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;font-family:inherit;cursor:pointer;transition:opacity .45s,transform .45s}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-avatar{width:96px;height:96px;border-radius:26px;object-fit:cover;border:2px solid rgba(255,255,255,.35);box-shadow:0 8px 28px rgba(0,0,0,.5)}
.sp-name{font-size:clamp(30px,9vw,40px);font-weight:600;letter-spacing:4px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.sp-hint{font-size:14px;letter-spacing:4px;color:rgba(255,255,255,.7);animation:pulse 2.4s ease-in-out infinite}
body.locked{overflow:hidden}
body:not(.ready) .page *{animation-play-state:paused}
@keyframes pulse{50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
@media(max-width:520px){.sub{font-size:13px;margin-bottom:24px}.card{font-size:16px}}
</style>
<noscript><style>.splash{display:none}body:not(.ready) .page *{animation-play-state:running}</style></noscript>
</head>
<body>
<button class="splash" id="splash" aria-label="进入网站" autofocus>
  <img class="sp-avatar" src="https://i.postimg.cc/YGF1kzV7/Image-1787996545032-703.jpg" alt="" width="96" height="96">
  <span class="sp-name">wxhn</span>
  <span class="sp-hint">点击进入</span>
</button>
<div class="bg" aria-hidden="true"></div>
<canvas id="snow" aria-hidden="true"></canvas>

<button class="menu-btn" id="menuBtn" aria-label="菜单" aria-expanded="false" aria-controls="panel"><span></span><span></span><span></span></button>
<div class="panel" id="panel">
  <a href="sofree/">sofree</a>
  <a href="story/">个人故事</a>
  <a href="ycz/">学校</a>
  <a href="Download/">下载</a>
  <hr>
  <button id="snowBtn" aria-pressed="true">雪花效果<span class="sw"></span></button>
  <button id="copyBtn">复制页面链接</button>
</div>

<main class="page">
  <img class="avatar" src="https://i.postimg.cc/YGF1kzV7/Image-1787996545032-703.jpg" alt="wxhn 的头像" width="110" height="110" fetchpriority="high" decoding="async">
  <h1>Roland</h1>
  <p class="sub">有点冷🥶</p>

  <nav class="links" aria-label="社交链接">
    <a class="card" style="--i:0;--c:#66c0f4" href="https://steamcommunity.com/profiles/76561198764721039/" target="_blank" rel="noopener noreferrer"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><circle cx="14.8" cy="9.6" r="2.7"/><circle cx="9" cy="15" r="1.6" fill="currentColor"/><path d="M10.4 13.4l2.3-2"/></svg></span>Steam</a>
    <a class="card" style="--i:1;--c:#ff3b3b" href="https://www.youtube.com/@YUAN_E5263" target="_blank" rel="noopener noreferrer"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4.5"/><path d="M10 9.3v5.4l4.5-2.7z" fill="currentColor"/></svg></span>YouTube</a>
    <a class="card" style="--i:2;--c:#fb7299" href="https://space.bilibili.com/3546393341856275?spm_id_from=333.337.0.0" target="_blank" rel="noopener noreferrer"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 4l2.5 2.5M16 4l-2.5 2.5"/><rect x="3" y="7" width="18" height="12" rx="3.5"/><path d="M8.5 12v1.5M15.5 12v1.5"/></svg></span>哔哩哔哩</a>
    <button class="card" style="--i:3;--c:#7983f5" data-copy="yuan_e_5263"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5C8 4.6 10 4.2 12 4.2s4 .4 6 1.3c1.6 2.7 2.6 5.6 2.8 9.2-1.5 1.2-3.1 2-4.8 2.5l-1-2M6 5.5C4.4 8.2 3.4 11.1 3.2 14.7c1.5 1.2 3.1 2 4.8 2.5l1-2M8.5 16.2c2.2.6 4.8.6 7 0"/><circle cx="9" cy="11.8" r="1" fill="currentColor"/><circle cx="15" cy="11.8" r="1" fill="currentColor"/></svg></span>Discord点击复制用户名</button>
  </nav>

  <a class="featured" href="tupian">精选内容</a>
  <p class="foot">感谢观看</p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s);
const toast=$('#toast');let tt;
function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1800)}
async function copy(t){
  try{await navigator.clipboard.writeText(t)}
  catch{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  say('已复制：'+t)
}
document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copy(b.dataset.copy)));

const mb=$('#menuBtn'),pn=$('#panel');
const menu=o=>{pn.classList.toggle('open',o);mb.setAttribute('aria-expanded',o)};
mb.addEventListener('click',e=>{e.stopPropagation();menu(!pn.classList.contains('open'))});
document.addEventListener('click',e=>{if(!pn.contains(e.target))menu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu(false);mb.focus()}});
$('#copyBtn').addEventListener('click',()=>{copy(location.href);menu(false)});

const cv=$('#snow'),g=cv.getContext('2d'),sb=$('#snowBtn');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let on,fl=[],raf,W,H;
try{on=localStorage.getItem('snow')}catch{}
on=on==null?!reduce:on==='1';
function fit(){
  const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);
  const n=Math.round(Math.min(90,Math.max(30,W/14)));
  if(fl.length!==n)fl=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+1,v:Math.random()+.5,p:Math.random()*6.28}));
}
function tick(){
  g.clearRect(0,0,W,H);g.fillStyle='#fff';
  for(const f of fl){
    f.p+=.01;f.y+=f.v;f.x+=Math.sin(f.p)*.5+.15;
    if(f.y>H+4){f.y=-4;f.x=Math.random()*W}
    if(f.x>W+4)f.x=-4;
    g.globalAlpha=.3+f.r*.18;g.beginPath();g.arc(f.x,f.y,f.r,0,6.283);g.fill();
  }
  raf=requestAnimationFrame(tick);
}
function snow(o){
  on=o;sb.setAttribute('aria-pressed',o);cancelAnimationFrame(raf);g.clearRect(0,0,W,H);
  if(o)tick();
  try{localStorage.setItem('snow',o?1:0)}catch{}
}
fit();snow(on);
sb.addEventListener('click',()=>snow(!on));
addEventListener('resize',fit);

const SPLASH='always';
const sp=$('#splash'),gated=document.querySelectorAll('.page,.menu-btn');
function enter(){document.body.classList.remove('locked');document.body.classList.add('ready');gated.forEach(e=>e.inert=false)}
let seen;try{seen=sessionStorage.getItem('seen')}catch{}
if(SPLASH==='off'||(SPLASH==='session'&&seen)){sp.remove();enter()}
else{
  document.body.classList.add('locked');gated.forEach(e=>e.inert=true);
  sp.addEventListener('click',()=>{
    sp.classList.add('out');
    try{sessionStorage.setItem('seen','1')}catch{}
    enter();setTimeout(()=>sp.remove(),500);
  });
}
</script>
</body>
</html>
