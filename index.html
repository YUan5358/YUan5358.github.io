<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="color-scheme" content="dark">

<link rel="preconnect" href="https://i.postimg.cc" crossorigin>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:dark;--glass:rgba(0,0,0,.45);--line:rgba(255,255,255,.14)}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;background:#050505;color:#fff;font-family:system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
body.no-scroll{overflow:hidden}
.bg{position:fixed;inset:0;z-index:-2;background:#050505 url(https://s41.ax1x.com/2026/04/03/peYnzut.jpg) center/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

.page{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:max(10vh,72px) 16px calc(5vh + env(safe-area-inset-bottom))}
.avatar{width:110px;height:110px;border-radius:30px;object-fit:cover;border:2px solid rgba(255,255,255,.35);box-shadow:0 8px 28px rgba(0,0,0,.5);margin-bottom:18px;animation:rise .6s ease backwards}
h1{font-size:clamp(28px,8vw,34px);font-weight:600;letter-spacing:3px;text-shadow:0 2px 6px rgba(0,0,0,.6);margin-bottom:6px;animation:rise .6s .08s ease backwards}
.sub{color:rgba(235,235,235,.85);font-size:15px;letter-spacing:3px;margin-bottom:32px;text-shadow:0 1px 4px rgba(0,0,0,.5);animation:rise .6s .14s ease backwards}

.links{display:flex;flex-direction:column;gap:12px;width:min(350px,100%)}
.card{--c:#fff;display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:11px 18px 11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-family:inherit;font-size:17px;font-weight:500;text-align:left;text-decoration:none;cursor:pointer;transition:transform .25s,background .25s,border-color .25s;animation:rise .6s ease backwards;animation-delay:calc(.2s + var(--i)*.07s)}
.ico{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.1);background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);font-size:20px}
/* 调整了这里的 SVG 样式，以完美显示填充风格的官方图标 */
.ico svg{width:22px;height:22px;fill:currentColor}
.card:active{transform:scale(.98)}
@media(hover:hover){.card:hover{transform:translateY(-3px);background:rgba(0,0,0,.62);border-color:var(--c)}}
.featured{display:block;width:min(350px,100%);margin-top:20px;padding:14px 22px;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.3);border-radius:14px;color:#ffd700;font-size:17px;font-weight:500;text-align:center;text-decoration:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .25s,background .25s;animation:rise .6s .5s ease backwards}
@media(hover:hover){.featured:hover{background:rgba(255,215,0,.22);transform:translateY(-2px)}}
.foot{margin-top:18px;font-size:13px;color:rgba(255,255,255,.6)}

.menu-btn{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:20;display:grid;place-content:center;gap:5px;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer}
.menu-btn span{display:block;width:20px;height:2px;border-radius:2px;background:rgba(255,255,255,.9);transition:transform .25s,opacity .25s}
.menu-btn[aria-expanded=true] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-btn[aria-expanded=true] span:nth-child(2){opacity:0}
.menu-btn[aria-expanded=true] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.panel{position:fixed;top:calc(max(12px,env(safe-area-inset-top)) + 52px);left:12px;z-index:20;width:min(240px,calc(100vw - 24px));padding:8px;border:1px solid var(--line);border-radius:14px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);visibility:hidden;opacity:0;transform:translateY(-6px);transition:visibility .2s,opacity .2s,transform .2s}
.panel.open{visibility:visible;opacity:1;transform:translateY(0)}
.panel a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.88);text-decoration:none;font-size:15px;letter-spacing:1px;transition:background .2s,color .2s}
.panel a:hover,.panel a:focus-visible{background:rgba(255,255,255,.1);color:#fff}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ---------- 赞助弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s ease}
.modal.show{opacity:1;visibility:visible}
.modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.68);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer}
.modal-box{position:relative;width:min(330px,100%);max-height:calc(100dvh - 48px);overflow:auto;padding:22px 20px 16px;border:1px solid rgba(255,255,255,.16);border-radius:20px;background:rgba(18,18,18,.94);box-shadow:0 24px 64px rgba(0,0,0,.65);text-align:center;transform:translateY(14px) scale(.95);transition:transform .32s cubic-bezier(.2,.9,.3,1.25)}
.modal.show .modal-box{transform:translateY(0) scale(1)}
.modal-box h2{font-size:19px;font-weight:600;letter-spacing:6px;text-indent:6px;color:#ffd700;margin-bottom:14px}
.qr-wrap{position:relative;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);min-height:120px;display:grid;place-items:center}
.qr{display:block;width:100%;height:auto}
.qr-fallback{display:none;padding:28px 12px;font-size:13px;line-height:1.8;color:rgba(255,255,255,.6)}
.modal-tip{margin-top:14px;font-size:12.5px;letter-spacing:1px;color:rgba(255,255,255,.55)}
.modal-close{position:absolute;top:8px;right:8px;width:32px;height:32px;display:grid;place-items:center;border:none;border-radius:50%;background:rgba(255,255,255,.1);color:rgba(255,255,255,.75);font-size:14px;line-height:1;cursor:pointer;transition:background .2s,color .2s}
.modal-close:hover{background:rgba(255,255,255,.2);color:#fff}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>

<!-- ========== 赞助弹窗 ========== -->
<div class="modal" id="sponsorModal" aria-hidden="true">
  <div class="modal-mask" data-close></div>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="sponsorTitle">
    <button class="modal-close" type="button" data-close aria-label="关闭">✕</button>
    <h2 id="sponsorTitle">赞助</h2>
    <div class="qr-wrap">
      <img class="qr" id="sponsorImg" src="https://s41.ax1x.com/2026/11/21/pnqGXwT.png" alt="赞助二维码" loading="eager">
      <p class="qr-fallback">图片加载失败<br>请检查网络或链接</p>
    </div>
    <p class="modal-tip">点击空白处关闭</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------------- 菜单 ---------------- */
  var menuBtn = document.getElementById('menuBtn');
  var panel = document.getElementById('menuPanel');

  function closeMenu() {
    menuBtn.setAttribute('aria-expanded', 'false');
    panel.classList.remove('open');
  }
  menuBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = menuBtn.getAttribute('aria-expanded') === 'true';
    menuBtn.setAttribute('aria-expanded', String(!open));
    panel.classList.toggle('open', !open);
  });
  document.addEventListener('click', function (e) {
    if (!panel.classList.contains('open')) return;
    if (panel.contains(e.target) || menuBtn.contains(e.target)) return;
    closeMenu();
  });

  /* ---------------- 赞助弹窗 ---------------- */
  var modal = document.getElementById('sponsorModal');

  function openModal() {
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('no-scroll');
  }
  function closeModal() {
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('no-scroll');
  }

  /* 点击空白（遮罩）或关闭按钮取消 */
  modal.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) closeModal();
  });
  /* ESC 也能关 */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
  });

  /* 每次进入页面自动弹一次 */
  var autoShown = false;
  function autoOpen() {
    if (autoShown) return;
    autoShown = true;
    openModal();
  }
  if (document.readyState === 'complete') {
    setTimeout(autoOpen, 500);
  } else {
    window.addEventListener('load', function () { setTimeout(autoOpen, 500); });
  }

  /* 手动再次打开（菜单 / 金色按钮） */
  ['sponsorLink', 'featuredSponsor'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', function (e) {
      e.preventDefault();
      closeMenu();
      openModal();
    });
  });

  /* 图片加载失败提示 */
  var img = document.getElementById('sponsorImg');
  img.addEventListener('error', function () {
    img.style.display = 'none';
    var fb = img.parentNode.querySelector('.qr-fallback');
    if (fb) fb.style.display = 'block';
  });

  /* ---------------- 雪花 ---------------- */
  var canvas = document.getElementById('snow');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, flakes = [], rafId = null;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initFlakes();
  }

  function initFlakes() {
    var n = Math.max(30, Math.min(140, Math.round(W * H / 15000)));
    flakes = [];
    for (var i = 0; i < n; i++) {
      flakes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.7 + 0.6,
        s: Math.random() * 0.55 + 0.25,
        d: Math.random() * 0.6 - 0.3,
        a: Math.random() * 0.5 + 0.25
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.s;
      f.x += f.d;
      if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
      if (f.x < -4) f.x = W + 4;
      if (f.x > W + 4) f.x = -4;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + f.a + ')';
      ctx.fill();
    }
    rafId = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else if (!rafId) {
      draw();
    }
  });

  resize();
  if (!reduceMotion) {
    draw();
  } else {
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + f.a + ')';
      ctx.fill();
    }
  }
})();
</script>
</body>
</html>
