    <script>
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            const size = Math.random() * 5 + 3;
            snowflake.style.width = `${size}px`;
            snowflake.style.height = `${size}px`;
            snowflake.style.left = `${Math.random() * 100}vw`;
            const duration = Math.random() * 5 + 8;
            const delay = Math.random() * 5;
            const wind = Math.random() * 10 - 5;
            snowflake.style.animation = `fall ${duration}s linear ${delay}s infinite`;
            snowflake.style.setProperty('--wind', wind);
            snowflake.style.opacity = Math.random() * 0.7 + 0.3;
            document.getElementById('snow-container').appendChild(snowflake);
            setTimeout(() => { snowflake.remove(); }, (duration + delay) * 1000);
        }
        function createSnowflakes() {
            const snowCount = 100;
            for (let i = 0; i < snowCount; i++) {
                setTimeout(() => { createSnowflake(); }, i * 300);
            }
            setInterval(() => { createSnowflake(); }, 300);
        }
        window.addEventListener('load', createSnowflakes);

        function toggleMenu() {
          const menu = document.getElementById("popMenu");
          menu.style.display = menu.style.display === "block" ? "none" : "block";
        }
        document.addEventListener("click", e => {
          if (!e.target.closest(".menu-btn") && !e.target.closest("#popMenu")) {
            document.getElementById("popMenu").style.display = "none";
          }
        });
