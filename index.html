          color: #fff;
          display: flex;
          align-items: center;
          font-size: 17px;
          font-weight: 500;
          transition: all 0.25s ease;
        }
        .card:hover { transform: translateY(-3px); background: rgba(0, 0, 0, 0.6); }
        .card i, .card svg { width: 26px; margin-right: 16px; font-size: 22px; display: flex; justify-content: center; flex-shrink: 0; }
        .card[href*="spotify"] { display: none; }
        .discord-svg-icon { fill: #5865F2; }
        .fa-steam { color: #66c0f4; }
        .fa-youtube { color: #ff0000; }
        .bilibili-icon { fill: #fb7299; }

        .sunshine-link { display: block; width: 350px; max-width: 100%; padding: 14px 22px; background: rgba(255, 215, 0, 0.12); border: 1px solid rgba(255, 215, 0, 0.25); border-radius: 14px; text-decoration: none; color: #FFD700; font-size: 17px; font-weight: 500; text-align: center; transition: all 0.25s ease; margin: 20px auto 0; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .sunshine-link:hover { background: rgba(255, 215, 0, 0.22); transform: translateY(-2px); }

        .download-link:hover { color: rgba(255, 255, 255, 0.5); }

        @media (max-width: 520px) {

        .pop-menu a {

        }
        .pop-menu a:last-child { border-bottom: none; }
        .pop-menu a:hover { background: rgba(250, 242, 232, 0.06); color: #fff; }
        .hide-old { display: none !important; }

    <script>
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            const size = Math.random() * 5 + 3;
            snowflake.style.width = `${size}px`;
            snowflake.style.height = `${size}px`;
            snowflake.style.left = `${Math.random() * 100}vw`;
            const duration = Math.random() * 5 + 8;
            const delay = Math.random() * 5;
            const wind = Math.random() * 10 - 5;
            snowflake.style.animation = `fall ${duration}s linear ${delay}s infinite`;
            snowflake.style.setProperty('--wind', wind);
            snowflake.style.opacity = Math.random() * 0.7 + 0.3;
            document.getElementById('snow-container').appendChild(snowflake);
            setTimeout(() => { snowflake.remove(); }, (duration + delay) * 1000);
        }
        function createSnowflakes() {
            const snowCount = 100;
            for (let i = 0; i < snowCount; i++) {
                setTimeout(() => { createSnowflake(); }, i * 300);
            }
            setInterval(() => { createSnowflake(); }, 300);
        }
        window.addEventListener('load', createSnowflakes);

        function toggleMenu() {
          const menu = document.getElementById("popMenu");
          menu.style.display = menu.style.display === "block" ? "none" : "block";
        }
        document.addEventListener("click", e => {
          if (!e.target.closest(".menu-btn") && !e.target.closest("#popMenu")) {
            document.getElementById("popMenu").style.display = "none";
          }
        });
